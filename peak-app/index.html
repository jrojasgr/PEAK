<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PEAK</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PEAK">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg: #0a0a0c;
  --bg-elev: #131316;
  --surface: #18181c;
  --surface-2: #1f1f24;
  --border: #29292f;
  --text: #f3f1ec;
  --text-dim: #a3a3ab;
  --text-faint: #6b6b73;
  --gold: #e8a94c;
  --gold-2: #c97a2e;
  --gold-dim: #8a6438;
  --ember: #d9714e;
  --success: #6bb98a;
  --danger: #d16a6a;
  --radius: 14px;
  --radius-sm: 9px;
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input, textarea{font-family:inherit; color:inherit; background:none; border:none; outline:none;}
::selection{background:var(--gold-dim); color:#fff;}
a{color:inherit;}
::-webkit-scrollbar{width:6px; height:6px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

/* focus visibility */
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--gold); outline-offset:2px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ============ APP SHELL ============ */
#app{ min-height:100vh; display:flex; flex-direction:column; }

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 24px; border-bottom:1px solid var(--border);
  position:sticky; top:0; background:rgba(10,10,12,0.85); backdrop-filter:blur(10px);
  z-index:20;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  width:26px; height:26px;
  background:linear-gradient(155deg, var(--gold), var(--ember));
  clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
}
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:0.5px; }
.streak-chip{
  display:flex; align-items:center; gap:6px;
  padding:6px 12px; border-radius:100px; background:var(--surface); border:1px solid var(--border);
  font-size:13px; font-weight:600; color:var(--gold);
}

.layout{ display:flex; flex:1; }

nav.sidenav{
  width:220px; flex-shrink:0; padding:20px 12px; border-right:1px solid var(--border);
  display:flex; flex-direction:column; gap:2px;
}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:var(--radius-sm);
  color:var(--text-dim); font-size:14px; font-weight:500; transition:background .15s, color .15s;
  text-align:left; width:100%;
}
.nav-item:hover{ background:var(--surface); color:var(--text); }
.nav-item.active{ background:var(--surface-2); color:var(--gold); }
.nav-item .ico{ width:18px; text-align:center; font-size:15px; }

main.view{ flex:1; padding:32px; max-width:920px; width:100%; margin:0 auto; padding-bottom:100px; }

/* bottom nav for mobile */
nav.bottomnav{
  display:none; position:fixed; bottom:0; left:0; right:0;
  background:rgba(19,19,22,0.95); backdrop-filter:blur(12px); border-top:1px solid var(--border);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index:30;
  justify-content:space-around;
}
.bottomnav .nav-item{ flex-direction:column; gap:3px; font-size:10.5px; padding:6px 4px; width:auto; text-align:center; }
.bottomnav .nav-item .ico{ font-size:18px; }

@media (max-width: 860px){
  nav.sidenav{ display:none; }
  nav.bottomnav{ display:flex; }
  main.view{ padding:20px 16px 96px; }
  .topbar{ padding:14px 18px; }
}

/* ============ SHARED UI ============ */
.section-title{ font-family:var(--font-display); font-size:13px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-faint); margin-bottom:10px; font-weight:600;}
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
.h1{ font-family:var(--font-display); font-size:28px; font-weight:700; letter-spacing:-0.3px; margin-bottom:4px; }
.h2{ font-family:var(--font-display); font-size:20px; font-weight:600; }
.muted{ color:var(--text-dim); font-size:14px; }
.faint{ color:var(--text-faint); font-size:12.5px; }
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius:100px;
  background:var(--gold); color:#161208; font-weight:600; font-size:14px; transition:transform .15s, filter .15s;
}
.btn:hover{ filter:brightness(1.08); }
.btn:active{ transform:scale(0.97); }
.btn.ghost{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
.btn.sm{ padding:7px 13px; font-size:12.5px; }
.btn.danger{ background:var(--danger); color:#fff; }
.icon-btn{ width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); }
.icon-btn:hover{ background:var(--surface-2); color:var(--text); }
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:600px){ .grid-2{ grid-template-columns:1fr; } }
.progress-track{ height:6px; border-radius:10px; background:var(--surface-2); overflow:hidden; }
.progress-fill{ height:100%; background:linear-gradient(90deg, var(--gold-2), var(--gold)); border-radius:10px; transition:width .5s ease; }
.pill{ display:inline-block; padding:3px 10px; border-radius:100px; font-size:11.5px; font-weight:600; background:var(--surface-2); color:var(--text-dim); }
.empty{ text-align:center; padding:50px 20px; color:var(--text-faint); font-size:14px; }
.modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; animation:fadeIn .18s ease; }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.modal{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; width:100%; max-width:420px; max-height:85vh; overflow-y:auto; animation:pop .18s ease; }
@keyframes pop{ from{opacity:0; transform:translateY(8px) scale(0.98);} to{opacity:1; transform:translateY(0) scale(1);} }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12px; color:var(--text-faint); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px; }
.field input, .field textarea{
  width:100%; background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:10px 12px; font-size:14px;
}
.field textarea{ min-height:70px; resize:vertical; }
.modal-actions{ display:flex; gap:10px; margin-top:18px; justify-content:flex-end; }

/* ============ QUOTE SCREEN ============ */
#quoteScreen{
  position:fixed; inset:0; z-index:200;
  background:
    radial-gradient(circle at 50% 115%, rgba(232,169,76,0.35), transparent 55%),
    linear-gradient(180deg, #0a0a0c 0%, #151114 55%, #1c130f 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px; text-align:center; cursor:pointer;
}
.peak-silhouette{ position:absolute; bottom:0; left:0; right:0; opacity:0.5; pointer-events:none; }
.quote-text{ font-family:var(--font-display); font-size:clamp(22px, 4.2vw, 34px); font-weight:600; max-width:640px; line-height:1.35; letter-spacing:-0.3px; z-index:1; }
.quote-author{ margin-top:18px; color:var(--gold); font-size:14px; letter-spacing:0.5px; z-index:1; }
.quote-hint{ position:absolute; bottom:36px; font-size:12px; color:var(--text-faint); letter-spacing:1px; text-transform:uppercase; z-index:1; }

/* ============ HOME ============ */
.today-card{
  border:1px solid var(--gold-dim); border-radius:var(--radius); padding:22px;
  background:linear-gradient(155deg, rgba(232,169,76,0.09), rgba(19,19,22,0.4));
  margin-bottom:20px;
}
.today-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.activity-row{
  display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--border);
}
.activity-row:last-child{ border-bottom:none; }
.check{
  width:22px; height:22px; border-radius:7px; border:1.5px solid var(--text-faint); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:13px; transition:all .15s;
}
.check.done{ background:var(--success); border-color:var(--success); color:#0a0a0c; }
.activity-name{ font-size:14.5px; font-weight:500; }
.activity-name.done{ text-decoration:line-through; color:var(--text-faint); }
.activity-time{ margin-left:auto; font-size:12px; color:var(--text-faint); flex-shrink:0; }
.all-done-banner{ text-align:center; padding:14px; color:var(--success); font-weight:600; font-size:14px; }
.week-row{ display:flex; gap:6px; margin-top:8px; }
.day-dot{ flex:1; height:34px; border-radius:8px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--text-faint); }
.day-dot.done{ background:var(--gold); color:#161208; font-weight:700; }

/* ============ RUTA ============ */
.skill-card{
  display:flex; align-items:center; gap:16px; padding:16px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--surface); margin-bottom:10px; cursor:pointer;
  transition:border-color .15s;
}
.skill-card:hover{ border-color:var(--gold-dim); }
.skill-card.locked{ opacity:0.45; cursor:not-allowed; }
.skill-num{ font-family:var(--font-display); font-size:13px; color:var(--text-faint); width:22px; }
.skill-ring{ position:relative; width:44px; height:44px; flex-shrink:0; }
.skill-ring svg{ transform:rotate(-90deg); }
.skill-info{ flex:1; min-width:0; }
.skill-info .name{ font-weight:600; font-size:15px; }
.skill-info .pct{ font-size:12px; color:var(--gold); margin-top:2px; }

/* skill detail */
.flow-step{ display:flex; align-items:center; gap:10px; padding:8px 0; font-size:14px; color:var(--text-dim); }
.flow-step .dot{ width:7px; height:7px; border-radius:50%; background:var(--gold); flex-shrink:0; }
.tag-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.tag{ padding:5px 11px; background:var(--surface-2); border-radius:100px; font-size:12.5px; color:var(--text-dim); }

/* ============ CALENDARIO ============ */
.cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.cal-status{ display:flex; gap:8px; margin-bottom:18px; }
.status-chip{ flex:1; text-align:center; padding:10px; border-radius:var(--radius-sm); font-size:12px; font-weight:600; border:1px solid var(--border); color:var(--text-faint); }
.status-chip.active{ border-color:var(--gold); color:var(--gold); background:rgba(232,169,76,0.08); }
.event-row{ display:flex; gap:14px; padding:13px 4px; border-bottom:1px solid var(--border); align-items:flex-start; }
.event-time{ font-size:12.5px; color:var(--gold); width:82px; flex-shrink:0; font-weight:600; }
.event-body .name{ font-weight:600; font-size:14.5px; }

/* ============ NOTAS ============ */
.note-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:10px; cursor:pointer; }
.note-card .title{ font-weight:600; font-size:14.5px; margin-bottom:4px; }
.note-card .preview{ font-size:13px; color:var(--text-dim); line-height:1.5; max-height:3em; overflow:hidden; }
.note-card .meta{ display:flex; gap:8px; margin-top:10px; align-items:center; }

/* ============ PIZARRA ============ */
.board-toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.color-dot{ width:24px; height:24px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
.color-dot.active{ border-color:#fff; }
#boardCanvas{ width:100%; height:60vh; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); touch-action:none; display:block; }

/* ============ FINANZAS ============ */
.fin-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:560px){ .fin-grid{ grid-template-columns:1fr; } }
.fin-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
.fin-card .label{ font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--text-faint); font-weight:600; }
.fin-card .amount{ font-family:var(--font-display); font-size:clamp(22px,4vw,30px); font-weight:700; margin-top:6px; }
.fin-card.income .amount{ color:var(--success); }
.fin-card.expense .amount{ color:var(--danger); }
.fin-card.balance .amount{ color:var(--gold); }
.fin-list-item{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
.fin-list-item:last-child{ border-bottom:none; }

/* ============ CAPTURA RÁPIDA ============ */
.fab{
  position:fixed; right:22px; bottom:88px; z-index:40;
  width:56px; height:56px; border-radius:50%;
  background:linear-gradient(155deg, var(--gold), var(--ember));
  color:#161208; font-size:26px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 20px rgba(232,169,76,0.35);
  transition:transform .15s;
}
.fab:active{ transform:scale(0.92); }
@media (min-width:861px){ .fab{ bottom:28px; } }

.inbox-card{ margin-bottom:22px; }
.inbox-item{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
.inbox-item:last-child{ border-bottom:none; }
.inbox-text{ flex:1; font-size:14px; }
.inbox-actions{ display:flex; gap:6px; flex-shrink:0; }
.mini-btn{ width:30px; height:30px; border-radius:8px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--text-dim); }
.mini-btn:hover{ color:var(--text); }
</style>
</head>

function todayStr(d = new Date()){ return d.toISOString().slice(0,10); }
function dayOfYear(d = new Date()){
  const start = new Date(d.getFullYear(),0,0);
  return Math.floor((d - start) / 86400000);
}
function fmtMoney(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('es-CO', {maximumFractionDigits:0});
}
function uid(){ return Math.random().toString(36).slice(2,10); }

async function saveKey(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.error('storage set failed', key, e); }
}
async function loadKey(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw !== null ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}

/* ---------------- skill progress helpers ---------------- */
function initSkillsIfNeeded(){
  SKILLS.forEach((s,i) => {
    if(!state.skills[s.id]){
      state.skills[s.id] = { progress: 0, unlocked: i===0 };
    }
  });
}
function currentSkill(){ return SKILLS.find(s => s.id === state.core.currentSkillId) || SKILLS[0]; }
function skillIndex(id){ return SKILLS.findIndex(s => s.id === id); }

/* ---------------- daily training generation ---------------- */
function ensureTrainingForToday(){
  const t = todayStr();
  if(state.training && state.training.date === t) return;
  const skill = currentSkill();
  const doy = dayOfYear();
  const pool = skill.pool;
  const count = Math.min(4, pool.length);
  const start = doy % pool.length;
  const picked = [];
  for(let i=0;i<count;i++){ picked.push(pool[(start+i)%pool.length]); }
  state.training = {
    date: t,
    skillId: skill.id,
    completed: false,
    activities: picked.map(p => ({ id:uid(), name:p.n, minutes:p.m, done:false })),
  };
  saveKey(STORAGE.training, state.training);
}

function checkAllDone(){
  return state.training && state.training.activities.every(a => a.done);
}

/* ---------------- inglés diario ---------------- */
function ensureEnglishForToday(){
  const t = todayStr();
  if(state.english && state.english.date === t) return;
  state.english = {
    date: t,
    completed: false,
    steps: ENGLISH_ROUTINE.map(s => ({ id:uid(), name:s.n, desc:s.d, minutes:s.m, done:false })),
  };
  saveKey(STORAGE.english, state.english);
}
function checkEnglishAllDone(){
  return state.english && state.english.steps.every(s => s.done);
}
async function completeEnglishIfNeeded(){
  if(!state.english) return;
  if(checkEnglishAllDone() && !state.english.completed){
    state.english.completed = true;
    const t = todayStr();
    if(state.englishMeta.lastCompletedDate !== t){
      const y = todayStr(new Date(Date.now()-86400000));
      state.englishMeta.streak = (state.englishMeta.lastCompletedDate === y) ? state.englishMeta.streak+1 : 1;
      state.englishMeta.lastCompletedDate = t;
    }
    state.englishMeta.totalMinutes += state.english.steps.reduce((a,s)=>a+s.minutes,0);
    await Promise.all([saveKey(STORAGE.english, state.english), saveKey('peak:englishMeta', state.englishMeta)]);
  }
}

async function completeDayIfNeeded(){
  if(!state.training) return;
  if(checkAllDone() && !state.training.completed){
    state.training.completed = true;
    const t = todayStr();
    if(state.core.lastCompletedDate !== t){
      const y = todayStr(new Date(Date.now()-86400000));
      state.core.streak = (state.core.lastCompletedDate === y) ? state.core.streak+1 : 1;
      state.core.lastCompletedDate = t;
    }
    state.core.weekDone[t] = true;
    const sk = state.skills[state.core.currentSkillId];
    sk.progress = Math.min(100, sk.progress + 8);
    if(sk.progress >= 100){
      const idx = skillIndex(state.core.currentSkillId);
      if(idx < SKILLS.length-1){
        const next = SKILLS[idx+1];
        state.skills[next.id].unlocked = true;
        state.core.currentSkillId = next.id;
      }
    }
    await Promise.all([saveKey(STORAGE.core,state.core), saveKey(STORAGE.skills,state.skills), saveKey(STORAGE.training,state.training)]);
  }
}

function openQuickCapture(){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="h2" style="margin-bottom:14px;">Captura rápida</div>
    <div class="faint" style="margin-bottom:14px;">Suéltalo aquí. Decides qué hacer con esto después.</div>
    <textarea id="quickText" placeholder="Idea, tarea, pendiente..." style="width:100%; min-height:90px; background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; font-size:15px;" autofocus></textarea>
    <div class="modal-actions">
      <button class="btn ghost sm" id="qcCancel">Cancelar</button>
      <button class="btn sm" id="qcSave">Guardar</button>
    </div>
  `;
  backdrop.appendChild(modal);
  backdrop.onclick = (e) => { if(e.target===backdrop) close(); };
  document.body.appendChild(backdrop);
  const ta = modal.querySelector('#quickText');
  setTimeout(()=>ta.focus(), 50);
  function close(){ backdrop.remove(); }
  modal.querySelector('#qcCancel').onclick = close;
  const save = async () => {
    const val = ta.value.trim();
    if(!val){ close(); return; }
    state.inbox.unshift({ id:uid(), text:val, date:todayStr() });
    await saveKey(STORAGE.inbox, state.inbox);
    close();
    renderNav(); renderView();
  };
  modal.querySelector('#qcSave').onclick = save;
  ta.addEventListener('keydown', (e) => { if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) save(); });
}

async function inboxToNote(item){
  state.notes.unshift({id:uid(), title:item.text.slice(0,40), content:item.text, category:'', date:todayStr()});
  state.inbox = state.inbox.filter(x=>x.id!==item.id);
  await Promise.all([saveKey(STORAGE.notes, state.notes), saveKey(STORAGE.inbox, state.inbox)]);
  renderView();
}
async function inboxToCalendar(item){
  state.inbox = state.inbox.filter(x=>x.id!==item.id);
  await saveKey(STORAGE.inbox, state.inbox);
  currentTab = 'calendario';
  renderNav(); renderView();
  openEventModal(item.text);
}
async function inboxDiscard(item){
  state.inbox = state.inbox.filter(x=>x.id!==item.id);
  await saveKey(STORAGE.inbox, state.inbox);
  renderView();
}

/* ==================================================================
   CALENDARIO
   ================================================================== */
function renderCalendario(view){
  const wrap = document.createElement('div');
  const today = todayStr();
  const todayEvents = state.calendar.filter(e => e.date === today).sort((a,b)=>a.start.localeCompare(b.start));
  const busyMinutes = todayEvents.reduce((a,e)=>{
    const [h1,m1]=e.start.split(':').map(Number), [h2,m2]=e.end.split(':').map(Number);
    return a + ((h2*60+m2)-(h1*60+m1));
  },0);
  const status = busyMinutes >= 480 ? 'SATURADO' : busyMinutes >= 180 ? 'OCUPADO' : 'DISPONIBLE';

  wrap.innerHTML = `
    <div class="cal-header">
      <div class="h1">Calendario</div>
      <button class="btn sm" id="addEventBtn">+ Evento</button>
    </div>
    <div class="muted" style="margin-bottom:14px;">Hoy · ${new Date().toLocaleDateString('es-CO',{weekday:'long', day:'numeric', month:'long'})}</div>
    <div class="cal-status">
      <div class="status-chip ${status==='DISPONIBLE'?'active':''}">DISPONIBLE</div>
      <div class="status-chip ${status==='OCUPADO'?'active':''}">OCUPADO</div>
      <div class="status-chip ${status==='SATURADO'?'active':''}">SATURADO</div>
    </div>
    <div class="card" id="eventsCard"></div>
  `;
  view.appendChild(wrap);
  wrap.querySelector('#addEventBtn').onclick = () => openEventModal();

  const card = wrap.querySelector('#eventsCard');
  if(todayEvents.length===0){
    card.innerHTML = `<div class="empty">No tienes eventos hoy.<br>Tu tiempo está disponible para entrenar.</div>`;
  }else{
    todayEvents.forEach(e => {
      const row = document.createElement('div');
      row.className = 'event-row';
      row.innerHTML = `
        <div class="event-time">${e.start} – ${e.end}</div>
        <div class="event-body" style="flex:1;">
          <div class="name">${escapeHtml(e.name)}</div>
          ${e.desc ? `<div class="faint">${escapeHtml(e.desc)}</div>` : ''}
        </div>
        <button class="icon-btn" data-id="${e.id}">✕</button>
      `;
      row.querySelector('.icon-btn').onclick = async () => {
        state.calendar = state.calendar.filter(x=>x.id!==e.id);
        await saveKey(STORAGE.calendar, state.calendar);
        renderCalendario(view);
      };
      card.appendChild(row);
    });
  }
}

      {key:'date', label:'Fecha', type:'date', value: todayStr()},
      {key:'start', label:'Hora inicio', type:'time', value:'09:00'},

  });
}

/* ==================================================================
   PIZARRA
   ================================================================== */
let boardCtx, boardDrawing=false, boardColor='#e8a94c', boardLast=null, boardStrokes=[], boardCurrent=null;

function renderPizarra(view){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="cal-header">
      <div class="h1">Pizarra</div>
      <button class="btn ghost sm" id="clearBoardBtn">Borrar todo</button>
    </div>
    <div class="board-toolbar">
      ${['#e8a94c','#f3f1ec','#6bb98a','#d16a6a','#7aa7d1'].map(c=>`<div class="color-dot" data-color="${c}" style="background:${c};"></div>`).join('')}
      <button class="btn ghost sm" id="eraserBtn">Borrador</button>
    </div>
    <canvas id="boardCanvas"></canvas>
    <div class="faint" style="margin-top:8px;">Se guarda automáticamente</div>
  `;
  view.appendChild(wrap);

  const canvas = wrap.querySelector('#boardCanvas');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  boardCtx = canvas.getContext('2d');
  boardCtx.scale(dpr,dpr);
  boardCtx.lineCap = 'round';
  boardCtx.lineJoin = 'round';

  redrawBoard(canvas);

  wrap.querySelectorAll('.color-dot').forEach(d => {
    d.onclick = () => { boardColor = d.dataset.color; wrap.querySelectorAll('.color-dot').forEach(x=>x.classList.remove('active')); d.classList.add('active'); };
  });
  wrap.querySelector('#eraserBtn').onclick = () => { boardColor = '__erase__'; };
  wrap.querySelector('#clearBoardBtn').onclick = async () => {
    boardStrokes = [];
    redrawBoard(canvas);
    await saveKey(STORAGE.board, boardStrokes);
  };

  const getPos = (ev) => {
    const r = canvas.getBoundingClientRect();
    const t = ev.touches ? ev.touches[0] : ev;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  };
  const start = (ev) => {
    ev.preventDefault();
    boardDrawing = true;
    const p = getPos(ev);
    boardCurrent = { color: boardColor, points:[p] };
  };
  const move = (ev) => {
    if(!boardDrawing) return;
    ev.preventDefault();
    const p = getPos(ev);
    boardCurrent.points.push(p);
    drawStroke(boardCurrent);
  };
  const end = async () => {
    if(!boardDrawing) return;
    boardDrawing = false;
    if(boardCurrent && boardCurrent.points.length>1){
      boardStrokes.push(boardCurrent);
      await saveKey(STORAGE.board, boardStrokes);
    }
    boardCurrent = null;
  };
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}

function drawStroke(stroke){
  const pts = stroke.points;
  if(pts.length<2) return;
  boardCtx.strokeStyle = stroke.color==='__erase__' ? '#18181c' : stroke.color;
  boardCtx.lineWidth = stroke.color==='__erase__' ? 22 : 3;
  boardCtx.beginPath();
  boardCtx.moveTo(pts[pts.length-2].x, pts[pts.length-2].y);
  boardCtx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
  boardCtx.stroke();
}
function redrawBoard(canvas){
  const rect = canvas.getBoundingClientRect();
  boardCtx.clearRect(0,0,rect.width,rect.height);
  boardStrokes.forEach(s => {
    boardCtx.strokeStyle = s.color==='__erase__' ? '#18181c' : s.color;
    boardCtx.lineWidth = s.color==='__erase__' ? 22 : 3;
    boardCtx.beginPath();
    s.points.forEach((p,i)=>{ if(i===0) boardCtx.moveTo(p.x,p.y); else boardCtx.lineTo(p.x,p.y); });
    boardCtx.stroke();
  });
}

   ================================================================== */
function renderFinanzas(view){
  const year = new Date().getFullYear();
  const inYear = (arr) => arr.filter(x => x.date && x.date.startsWith(String(year)));
  const totalIncome = inYear(state.finance.incomes).reduce((a,x)=>a+Number(x.value),0);
  const totalExpense = inYear(state.finance.expenses).reduce((a,x)=>a+Number(x.value),0);
  const balance = totalIncome - totalExpense;
  const totalInvested = state.finance.investments.reduce((a,x)=>a+Number(x.value),0);

  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="h1" style="margin-bottom:18px;">Finanzas</div>`;

  const grid = document.createElement('div');
  grid.className = 'fin-grid';
  grid.innerHTML = `
    <div class="fin-card income">
      <div class="label">Ingresos ${year}</div>
      <div class="amount">${fmtMoney(totalIncome)}</div>
      <button class="btn ghost sm" style="margin-top:12px;" id="addIncomeBtn">+ Agregar ingreso</button>
    </div>
    <div class="fin-card expense">
      <div class="label">Egresos ${year}</div>
      <div class="amount">${fmtMoney(totalExpense)}</div>
      <button class="btn ghost sm" style="margin-top:12px;" id="addExpenseBtn">+ Agregar egreso</button>
    </div>
    <div class="fin-card balance">
      <div class="label">Balance</div>
      <div class="amount">${fmtMoney(balance)}</div>
    </div>
    <div class="fin-card">
      <div class="label">Total invertido</div>
      <div class="amount" style="color:var(--gold);">${fmtMoney(totalInvested)}</div>
      <button class="btn ghost sm" style="margin-top:12px;" id="addInvestBtn">+ Agregar inversión</button>
    </div>
  `;
  wrap.appendChild(grid);

  const listsWrap = document.createElement('div');
  listsWrap.style.marginTop = '22px';
  listsWrap.innerHTML = `
    <div class="section-title">Movimientos recientes</div>
    <div class="card" id="movList"></div>
  `;
  wrap.appendChild(listsWrap);
  view.appendChild(wrap);

  const movList = listsWrap.querySelector('#movList');
  const all = [
    ...state.finance.incomes.map(x=>({...x, kind:'Ingreso', sign:1})),
    ...state.finance.expenses.map(x=>({...x, kind:'Egreso', sign:-1})),
    ...state.finance.investments.map(x=>({...x, kind:'Inversión', sign:0})),
  ].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);

  if(all.length===0){
    movList.innerHTML = `<div class="empty">Aún no hay movimientos registrados.</div>`;
  }else{
    all.forEach(m => {
      const row = document.createElement('div');
      row.className = 'fin-list-item';
      const color = m.sign>0?'var(--success)':m.sign<0?'var(--danger)':'var(--gold)';
      row.innerHTML = `
        <div>
          <div style="font-weight:600;">${escapeHtml(m.name)}</div>
          <div class="faint">${m.kind} · ${m.date}</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div style="color:${color}; font-weight:600;">${m.sign<0?'-':''}${fmtMoney(m.value)}</div>
          <button class="icon-btn" data-id="${m.id}">✕</button>
        </div>
      `;
      row.querySelector('.icon-btn').onclick = async () => {
        state.finance.incomes = state.finance.incomes.filter(x=>x.id!==m.id);
        state.finance.expenses = state.finance.expenses.filter(x=>x.id!==m.id);
        state.finance.investments = state.finance.investments.filter(x=>x.id!==m.id);
        await saveKey(STORAGE.finance, state.finance);
        renderFinanzas(view);
      };
      movList.appendChild(row);
    });
  }

  grid.querySelector('#addIncomeBtn').onclick = () => openFinanceModal('incomes','Nuevo ingreso');
  grid.querySelector('#addExpenseBtn').onclick = () => openFinanceModal('expenses','Nuevo egreso');
  grid.querySelector('#addInvestBtn').onclick = () => openFinanceModal('investments','Nueva inversión', true);
}

function openFinanceModal(bucket, title, isInvestment){
  showModal({
    title,
    fields:[
      {key:'name', label:'Nombre / descripción', type:'text'},
      {key:'value', label: isInvestment ? 'Valor actual' : 'Valor', type:'number'},
      {key:'date', label:'Fecha', type:'date', value: todayStr()},
    ],
    onSave: async (vals) => {
      if(!vals.name || !vals.value) return;
      state.finance[bucket].push({id:uid(), name:vals.name, value:Number(vals.value), date:vals.date});
      await saveKey(STORAGE.finance, state.finance);
      renderView();
    }
  });
}

/* ==================================================================
   MODAL genérico
   ================================================================== */
function showModal({title, fields, onSave, extraActions}){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `<div class="h2" style="margin-bottom:16px;">${title}</div><div id="modalFields"></div>`;
  const fieldsWrap = modal.querySelector('#modalFields');
  fields.forEach(f => {
    const el = document.createElement('div');
    el.className = 'field';
    const inputTag = f.type === 'textarea' ? 'textarea' : 'input';
    const typeAttr = f.type==='textarea' ? '' : `type="${f.type||'text'}"`;
    el.innerHTML = `<label>${f.label}</label><${inputTag} ${typeAttr} data-key="${f.key}">${f.type==='textarea'?(f.value||''):''}</${inputTag}>`;
    fieldsWrap.appendChild(el);
    const input = el.querySelector(`[data-key="${f.key}"]`);
    if(f.type!=='textarea') input.value = f.value || '';
  });

  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  if(extraActions){
    extraActions.forEach(a => {
      const b = document.createElement('button');
      b.className = 'btn ' + (a.danger?'danger':'ghost') + ' sm';
      b.textContent = a.label;
      b.onclick = () => { a.onClick(); close(); };
      actions.appendChild(b);
    });
  }
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn ghost sm';
  cancelBtn.textContent = 'Cancelar';
  cancelBtn.onclick = close;
  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn sm';
  saveBtn.textContent = 'Guardar';
  saveBtn.onclick = () => {
    const vals = {};
    fields.forEach(f => { vals[f.key] = fieldsWrap.querySelector(`[data-key="${f.key}"]`).value; });
    onSave(vals);
    close();
  };
  actions.appendChild(cancelBtn);
  actions.appendChild(saveBtn);
  modal.appendChild(actions);
  backdrop.appendChild(modal);
  backdrop.onclick = (e) => { if(e.target===backdrop) close(); };
  document.body.appendChild(backdrop);
  function close(){ backdrop.remove(); }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}

   QUOTE SCREEN + BOOT
   ================================================================== */
function maybeShowQuote(){
  const t = todayStr();
  if(state.core.lastQuoteDate === t){ boot(); return; }
  const q = QUOTES[dayOfYear() % QUOTES.length];
  document.getElementById('quoteText').textContent = '“' + q.t + '”';
  document.getElementById('quoteAuthor').textContent = '— ' + q.a;
  const screen = document.getElementById('quoteScreen');
  screen.style.display = 'flex';
  screen.onclick = async () => {
    screen.style.display = 'none';
    state.core.lastQuoteDate = t;
    await saveKey(STORAGE.core, state.core);
    boot();
  };
}

function boot(){
  document.getElementById('app').style.display = 'block';
  renderNav();
  renderView();
}

async function init(){
  const [core, skills, training, english, englishMeta, notes, calendar, finance, board, inbox] = await Promise.all([
    loadKey(STORAGE.core, state.core),
    loadKey(STORAGE.skills, {}),
    loadKey(STORAGE.training, null),
    loadKey(STORAGE.english, null),
    loadKey('peak:englishMeta', state.englishMeta),
    loadKey(STORAGE.notes, []),
    loadKey(STORAGE.calendar, []),
    loadKey(STORAGE.finance, state.finance),
    loadKey(STORAGE.board, []),
    loadKey(STORAGE.inbox, []),
  ]);
  state.core = {...state.core, ...core};
  state.skills = skills || {};
  state.training = training;
  state.english = english;
  state.englishMeta = englishMeta || state.englishMeta;
  state.notes = notes || [];
  state.calendar = calendar || [];
  state.finance = finance || state.finance;
  boardStrokes = board || [];
  state.inbox = inbox || [];

  initSkillsIfNeeded();
  ensureTrainingForToday();
  ensureEnglishForToday();
  await saveKey(STORAGE.skills, state.skills);

  document.getElementById('fabCapture').onclick = openQuickCapture;

  maybeShowQuote();
}

init();

  });
